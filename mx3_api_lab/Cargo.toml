[package]
name = "mx3_api_lab"
description = "The electronics lab API of mx3: parts, parameters, MPN schemes, BOMs, PCBs, suppliers, warehouse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
# HTTP clients for the mx3 backend: a blocking client and an async one answering through polled promises
client = ["dep:anyhow", "dep:reqwest", "dep:thiserror", "dep:tokio", "dep:tracing", "mx3_api_core/client"]
# sqlx::Type on the id newtypes and enums, for a backend built on sqlx
sqlx = ["dep:sqlx", "mx3_api_core/sqlx"]

[dependencies]
anyhow = { workspace = true, optional = true }
chrono.workspace = true
human-repr.workspace = true
itertools.workspace = true
mpn_schemes.workspace = true
mx3_api_core.workspace = true
reqwest = { workspace = true, optional = true, features = ["blocking", "json", "multipart"] }
rvariant.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, optional = true }
strum.workspace = true
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[lints]
workspace = true
